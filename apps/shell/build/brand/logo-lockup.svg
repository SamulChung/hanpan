<?xml version="1.0" encoding="UTF-8"?>
<!--
  Hanpan (한판) logo lockup (source of truth for the in-app sidebar logo).

  Pure black and white on purpose: the shell flips it for dark themes with a
  CSS invert filter, so it must not carry any colour.

  The mark repeats apps/shell/build/brand/app-icon.svg in one colour. The
  wordmark "한판" is drawn from rectangles and a ring (ㅎ ㅏ ㄴ, ㅍ ㅏ ㄴ), so it
  renders the same everywhere without any font.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" fill="none">
  <svg width="240" height="240" viewBox="0 0 1024 1024">
    <rect width="1024" height="1024" rx="230" fill="#000"/>
    <rect x="176" y="224" width="672" height="576" rx="80" fill="#fff"/>
    <path d="M424 512 H468 M468 380 V644 M468 380 H520 M468 512 H520 M468 644 H520" stroke="#000" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="344" cy="512" r="84" fill="#000"/>
    <rect x="520" y="350" width="232" height="60" rx="30" fill="#000"/>
    <rect x="520" y="482" width="196" height="60" rx="30" fill="#000"/>
    <rect x="520" y="614" width="164" height="60" rx="30" fill="#000"/>
  </svg>
  <g fill="#000">
    <!-- 한: ㅎ (cap, bar, ring), ㅏ, ㄴ -->
    <rect x="335" y="34" width="44" height="22" rx="4"/>
    <rect x="300" y="66" width="114" height="24" rx="4"/>
    <circle cx="357" cy="126" r="30" fill="none" stroke="#000" stroke-width="24"/>
    <rect x="432" y="30" width="26" height="132" rx="4"/>
    <rect x="452" y="84" width="34" height="24" rx="4"/>
    <rect x="310" y="168" width="26" height="46" rx="4"/>
    <rect x="310" y="190" width="176" height="24" rx="4"/>
    <!-- 판: ㅍ, ㅏ, ㄴ -->
    <rect x="530" y="40" width="120" height="22" rx="4"/>
    <rect x="556" y="58" width="22" height="58" rx="3"/>
    <rect x="602" y="58" width="22" height="58" rx="3"/>
    <rect x="524" y="112" width="132" height="24" rx="4"/>
    <rect x="672" y="30" width="26" height="132" rx="4"/>
    <rect x="692" y="84" width="34" height="24" rx="4"/>
    <rect x="550" y="168" width="26" height="46" rx="4"/>
    <rect x="550" y="190" width="176" height="24" rx="4"/>
  </g>
</svg>
